# Intégration continue : chaque push sur main et chaque Pull Request.
# Vercel déploie de son côté ; ce contrôle dit seulement si le code est sain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Typage, lint, tests unitaires et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run models:validate
      # Le build télécharge les polices Google : un échec réseau passager ne doit pas faire échouer la CI.
      - name: Build (deux nouvelles tentatives si le téléchargement des polices échoue)
        run: npm run build || (sleep 15 && npm run build) || (sleep 30 && npm run build)
      # Construit une seule fois : les tâches navigateur réutilisent ce build.
      - uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1

  pipeline:
    name: Pipeline CAO (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # test_web_retouch appelle `npx gltf-transform` : il faut aussi les dépendances Node.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest -q pipeline/tests

  navigateurs:
    name: Tests navigateur (${{ matrix.projet }})
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Chromium ordinateur et mobile, et WebKit (moteur de Safari) en iPhone.
        projet: [desktop, mobile, iphone]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.projet == 'iphone' && 'webkit' || 'chromium' }}
      - uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .next
      - run: npx playwright test --project=${{ matrix.projet }}
      - name: Captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: echecs-${{ matrix.projet }}
          path: test-results/
          retention-days: 7
