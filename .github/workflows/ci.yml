# Intégration continue : chaque push sur main et chaque Pull Request.
# Vercel déploie de son côté ; ce contrôle dit seulement si le code est sain.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Typage, lint, tests unitaires et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run models:validate
      - run: npm run build

  pipeline:
    name: Pipeline CAO (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # test_web_retouch appelle `npx gltf-transform` : il faut aussi les dépendances Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt pytest
      - run: python -m pytest -q pipeline/tests

  navigateurs:
    name: Tests navigateur (${{ matrix.projet }})
    needs: verifier
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Chromium ordinateur et mobile, et WebKit (moteur de Safari) en iPhone.
        projet: [desktop, mobile, iphone]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.projet == 'iphone' && 'webkit' || 'chromium' }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.projet }}
      - name: Captures et traces en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: echecs-${{ matrix.projet }}
          path: test-results/
          retention-days: 7
